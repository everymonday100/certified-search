services:
  verifier-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certified-search-api
    ports:
      - "8000:8000"
    volumes:
      # Сохраняем базу данных Ledger на хост-машине
      - ./ledger:/app/ledger
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s