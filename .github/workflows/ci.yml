name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Architectural Boundary Enforcement
  # This runs FIRST and independently. If this fails, nothing else matters.
  arch-lint:
    name: 🛡️ Architecture Isolation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Architecture Enforcer
        run: |
          chmod +x scripts/check_architecture.py
          python scripts/check_architecture.py

  # Job 2: Generator (Python) Lint & Test
  generator-test:
    name: 🐍 Generator (Python)
    needs: arch-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core/generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest mypy
          # pip install -r requirements.txt (when created)
      - name: Lint with Ruff
        run: ruff check .
      - name: Type check with Mypy
        run: mypy src/ || true # Non-blocking for v0, will enforce later
      - name: Run Pytest
        run: pytest tests/ -v

  # Job 3: Verifier (C++) Build & Test
  verifier-test:
    name: ⚙️ Verifier (C++)
    needs: arch-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core/verifier
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ clang-format
      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 4
      - name: Check formatting (clang-format)
        run: |
          find src/ -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

  # Job 4: Verifier Container Build
  container-build:
    name: 🐳 Verifier Container
    needs: verifier-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t certified-search/verifier:ci-${{ github.sha }} -f core/verifier/Dockerfile core/verifier/